<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Search - Vinyl Shop</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="container nav-wrapper">
        <div class="logo">
          <div class="logo-circle"></div>
          <h1>VINYL SHOP</h1>
        </div>
        <nav>
          <ul>
            <li><a href="Web.html">Home</a></li>
          </ul>
        </nav>
        <div class="meny-icons">
          <a class="icon" href="search.html" aria-label="Search">
            <i class="fa-solid fa-magnifying-glass"></i>
          </a>
          <a class="icon" href="cart.html" aria-label="Cart">
            <i class="fa-solid fa-cart-shopping"></i>
          </a>
        </div>
      </div>
    </header>

    <main class="container search-page">
      <h2>Search</h2>
      <form class="search-bar">
        <input type="search" placeholder="Search for albums or artists" />
        <button type="submit">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </form>
    </main>
    <footer>
      <p>Vinyl Shop</p>
    </footer>
  </body>
</html>
